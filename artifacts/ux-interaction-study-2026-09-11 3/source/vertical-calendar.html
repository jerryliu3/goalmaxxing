<div id="vertical-calendar-study" aria-label="Vertical week calendar concepts">
 <div class="vc-eyebrow"><span>PLAN · VERTICAL WEEK</span><span>Illustrative data</span></div>
 <div class="vc-tools"><label>Concept <select id="vc-concept"><option value="anchor">Anchor cascade</option><option value="ribbon">Vertical ribbon</option></select></label><div class="vc-views"><button data-level="0">Month</button><button data-level="1">Week</button><button data-level="2">Day</button></div></div>
 <div class="vc-title"><h3 id="vc-heading">September 2026</h3><div><button id="vc-prev" aria-label="Previous date">←</button><button id="vc-next" aria-label="Next date">→</button></div></div>
 <div id="vc-stage" aria-label="Calendar. Tap a date to focus its week; tap a week row to open the day."></div>
 <label class="vc-depth">Month → vertical week → day<input id="vc-depth" type="range" min="0" max="2" step="0.01" value="0"></label>
 <div class="vc-footer"><span id="vc-caption">Tap a date to open its week</span><span id="vc-status" aria-live="polite">September 17 selected</span></div>
</div>
<style>
#vertical-calendar-study{--v-bg:light-dark(#f5f2e9,#23271f);--v-paper:light-dark(#fffdf7,#30372a);--v-ink:light-dark(#30392a,#e6eadb);--v-dim:light-dark(#626e59,#bcc6ac);--v-line:light-dark(#d6dbc9,#515d45);--v-green:light-dark(#dce7ce,#425635);--v-mark:light-dark(#4f6d39,#b2d596);font:14px Arial,sans-serif;background:var(--v-bg);color:var(--v-ink);padding:20px;border-radius:16px}
#vertical-calendar-study *{box-sizing:border-box}#vertical-calendar-study .vc-eyebrow,#vertical-calendar-study .vc-tools,#vertical-calendar-study .vc-title,#vertical-calendar-study .vc-footer{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}#vertical-calendar-study .vc-eyebrow{font-size:11px;letter-spacing:.08em;color:var(--v-dim);margin-bottom:18px}#vertical-calendar-study button,#vertical-calendar-study select{font:inherit;color:inherit;background:var(--v-paper);border:1px solid var(--v-line);border-radius:8px;padding:10px;min-height:44px;cursor:pointer}#vertical-calendar-study button[aria-pressed=true]{background:var(--v-green);border-color:var(--v-mark)}#vertical-calendar-study label{display:flex;align-items:center;gap:8px;font-size:12px}#vertical-calendar-study .vc-views{display:flex;gap:4px}#vertical-calendar-study h3{font:400 24px Georgia,serif;margin:20px 0}#vertical-calendar-study .vc-title button{min-width:44px}#vc-stage{height:490px;position:relative;overflow:hidden;isolation:isolate;touch-action:pan-x}#vertical-calendar-study .vc-day{position:absolute;top:0;left:0;overflow:hidden;min-height:0;padding:0;text-align:left;will-change:transform,width,height}#vertical-calendar-study .vc-date{position:absolute;left:10px;top:10px;font-family:Georgia,serif;font-size:20px}#vertical-calendar-study .vc-weekday{position:absolute;left:40px;top:15px;color:var(--v-dim);font-size:12px}#vertical-calendar-study .vc-work{position:absolute;left:105px;top:10px;right:10px;padding:9px 10px;background:var(--v-green);border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}#vertical-calendar-study .vc-detail{position:absolute;left:18px;right:18px;top:100px;display:grid;gap:22px;font-size:16px}#vertical-calendar-study .vc-detail span{border-top:1px solid var(--v-line);padding-top:18px}#vertical-calendar-study .vc-detail small{display:block;color:var(--v-dim);font-size:12px;margin-bottom:10px}#vertical-calendar-study .vc-mark{position:absolute;left:10px;top:42px;width:16px;height:4px;border-radius:4px;background:var(--v-mark)}#vertical-calendar-study .vc-depth{margin-top:20px;display:grid;gap:10px}#vertical-calendar-study input{width:100%;accent-color:var(--v-mark)}#vertical-calendar-study .vc-footer{margin-top:10px;color:var(--v-dim);font-size:11px}@media(max-width:420px){#vertical-calendar-study{padding:12px}#vertical-calendar-study h3{font-size:21px}#vertical-calendar-study .vc-date{left:7px}#vertical-calendar-study .vc-work{left:89px}#vertical-calendar-study .vc-weekday{left:35px}}
</style>
<script>
(()=>{const root=document.getElementById('vertical-calendar-study'),stage=root.querySelector('#vc-stage'),range=root.querySelector('#vc-depth'),reduce=matchMedia('(prefers-reduced-motion: reduce)'),opts={duration:720};let selected=17,depth=0,mode='anchor',raf=0;
const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],work=['Strength','Read 20 minutes','Thesis · outline','Tempo run','Read 20 minutes','Long run','Weekly review'];
const els=Array.from({length:35},(_,i)=>{const el=document.createElement('button');el.type='button';el.className='vc-day';el.disabled=i<1||i>30;el.setAttribute('aria-label',(i<1?'August 31':i>30?'October '+(i-30):'September '+i)+', '+names[i%7]);el.innerHTML='<span class="vc-date">'+(i<1?31:i>30?i-30:i)+'</span><span class="vc-weekday">'+names[i%7]+'</span><span class="vc-mark"></span><span class="vc-work">'+work[i%7]+'</span><div class="vc-detail"><small>Placed work</small><span>○ '+work[i%7]+'</span><span>○ Evening walk</span></div>';el.onclick=()=>{if(moved)return;select(i,depth<.5?1:2)};stage.appendChild(el);return el;});
const mix=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function layout(i,d){const W=stage.clientWidth,H=490,g=6,c=i%7,r=Math.floor(i/7),sr=Math.floor(selected/7),idx=i-sr*7,mw=(W-6*g)/7,mh=(H-4*g)/5,wh=(H-6*g)/7;const m={x:c*(mw+g),y:r*(mh+g),w:mw,h:mh},w={x:0,y:idx*(wh+g),w:W,h:wh},day={x:0,y:(i-selected)*(H+g),w:W,h:H};if(d>=1){const t=d-1;return Object.fromEntries(Object.keys(w).map(k=>[k,mix(w[k],day[k],t)]));}
const t=d;let p={};if(mode==='anchor'){for(const k of ['x','y','w','h'])p[k]=mix(m[k],w[k],t);p.x+=Math.sin(t*Math.PI)*(idx-(selected%7))*Math.min(9,W/50);if(i===selected){p.w=mix(m.w,w.w,Math.min(1,t*1.3));p.x=mix(m.x,0,Math.min(1,t*1.3));}}
else{const bend={x:0,y:w.y,w:Math.min(76,W),h:wh};const a=t<.48?m:bend,b=t<.48?bend:w,u=t<.48?t/.48:(t-.48)/.52;for(const k of ['x','y','w','h'])p[k]=mix(a[k],b[k],ease(u));}return p;}
function paint(d){depth=d;els.forEach((el,i)=>{const p=layout(i,d),visible=p.x+p.w>0&&p.x<stage.clientWidth&&p.y+p.h>0&&p.y<490;el.style.transform='translate('+p.x+'px,'+p.y+'px)';el.style.width=p.w+'px';el.style.height=p.h+'px';el.style.zIndex=i===selected?3:1;el.inert=!visible;el.setAttribute('aria-hidden',String(!visible));el.setAttribute('aria-pressed',String(i===selected));el.querySelector('.vc-weekday').style.visibility=p.w>85?'visible':'hidden';el.querySelector('.vc-work').style.visibility=p.w>200&&p.h<100?'visible':'hidden';el.querySelector('.vc-detail').style.visibility=p.w>220&&p.h>250?'visible':'hidden';el.querySelector('.vc-mark').style.visibility=p.w<85?'visible':'hidden';});range.value=d;root.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(+b.dataset.level-d)<.05)));root.querySelector('#vc-heading').textContent=d<.5?'September 2026':d<1.5?'September '+Math.max(1,Math.floor(selected/7)*7)+'–'+Math.min(30,Math.floor(selected/7)*7+6):names[selected%7]+', September '+selected;root.querySelector('#vc-caption').textContent=d<.5?'Tap a date to open its week':d<1.5?'Tap a row to enter the day':'Swipe up/down or use arrows for adjacent days';root.querySelector('#vc-prev').disabled=selected===1;root.querySelector('#vc-next').disabled=selected===30;}
function go(to){cancelAnimationFrame(raf);const from=depth,start=performance.now();const tick=now=>{const t=reduce.matches?1:Math.min(1,(now-start)/opts.duration);paint(mix(from,to,ease(t)));if(t<1)raf=requestAnimationFrame(tick);else root.querySelector('#vc-status').textContent='September '+selected+' · '+['Month','Vertical week','Day'][to];};raf=requestAnimationFrame(tick);}
function select(date,to){cancelAnimationFrame(raf);const old=els.map(el=>({transform:el.style.transform,width:el.style.width,height:el.style.height}));selected=date;paint(depth);if(depth>=.5&&!reduce.matches)els.forEach((el,i)=>el.animate([old[i],{transform:el.style.transform,width:el.style.width,height:el.style.height}],{duration:280,easing:'ease-out'}));go(to);}
root.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>go(+b.dataset.level));root.querySelector('#vc-concept').onchange=e=>{cancelAnimationFrame(raf);mode=e.target.value;paint(0)};range.oninput=()=>{cancelAnimationFrame(raf);paint(+range.value)};range.onchange=()=>go(Math.round(+range.value));root.querySelector('#vc-prev').onclick=()=>select(Math.max(1,selected-1),Math.round(depth));root.querySelector('#vc-next').onclick=()=>select(Math.min(30,selected+1),Math.round(depth));let down=null,moved=false;stage.onpointerdown=e=>{down={x:e.clientX,y:e.clientY};moved=false};stage.onpointermove=e=>{if(down&&Math.abs(e.clientY-down.y)>12)moved=true};stage.onpointerup=e=>{if(down&&depth>1.8&&Math.abs(e.clientY-down.y)>45){const next=Math.max(1,Math.min(30,selected+(e.clientY<down.y?1:-1)));select(next,2);}down=null;};stage.onpointercancel=()=>{down=null;moved=false};new ResizeObserver(()=>paint(depth)).observe(stage);paint(0);if(globalThis.Tweak){new Tweak({container:root,onChange:()=>paint(depth)}).addSlider(opts,'duration',{label:'Motion duration',min:240,max:1200,step:20,unit:'ms'});}})();
</script>
