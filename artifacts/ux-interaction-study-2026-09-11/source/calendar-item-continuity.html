<div id="item-continuity-study" aria-label="Calendar item continuity concepts">
 <div class="ic-eyebrow"><span>PLAN · ITEM CONTINUITY</span><span>Illustrative data</span></div>
 <div class="ic-tools"><label>Concept <select id="ic-concept"><option value="anchor">Anchor · carried pills</option><option value="ribbon">Ribbon · carried tickets</option></select></label><div class="ic-views"><button data-level="0">Month</button><button data-level="1">Week</button><button data-level="2">Day</button></div></div>
 <div class="ic-title"><h3 id="ic-heading">September 2026</h3><div><button id="ic-prev" aria-label="Previous date">←</button><button id="ic-next" aria-label="Next date">→</button></div></div>
 <div id="ic-stage" aria-label="Calendar. Tap a date to focus its week; tap a week row to open the day."></div>
 <label class="ic-depth">Scrub: month → vertical week → checklist<input id="ic-depth" type="range" min="0" max="2" step="0.01" value="0"></label>
 <div class="ic-footer"><span id="ic-caption">Tap a date to open its week</span><span id="ic-status" aria-live="polite">September 17 selected</span></div>
</div>
<style>
#item-continuity-study{--v-bg:light-dark(#f5f2e9,#23271f);--v-paper:light-dark(#fffdf7,#30372a);--v-ink:light-dark(#30392a,#e6eadb);--v-dim:light-dark(#626e59,#bcc6ac);--v-line:light-dark(#d6dbc9,#515d45);--v-green:light-dark(#dce7ce,#425635);--v-mark:light-dark(#4f6d39,#b2d596);font:14px Arial,sans-serif;background:var(--v-bg);color:var(--v-ink);padding:20px;border-radius:16px}
#item-continuity-study *{box-sizing:border-box}#item-continuity-study .ic-eyebrow,#item-continuity-study .ic-tools,#item-continuity-study .ic-title,#item-continuity-study .ic-footer{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}#item-continuity-study .ic-eyebrow{font-size:11px;letter-spacing:.08em;color:var(--v-dim);margin-bottom:18px}#item-continuity-study button,#item-continuity-study select{font:inherit;color:inherit;background:var(--v-paper);border:1px solid var(--v-line);border-radius:8px;padding:10px;min-height:44px;cursor:pointer}#item-continuity-study button[aria-pressed=true]{background:var(--v-green);border-color:var(--v-mark)}#item-continuity-study label{display:flex;align-items:center;gap:8px;font-size:12px}#item-continuity-study .ic-views{display:flex;gap:4px}#item-continuity-study h3{font:400 24px Georgia,serif;margin:20px 0}#item-continuity-study .ic-title button{min-width:44px}#ic-stage{height:490px;position:relative;overflow:hidden;isolation:isolate;touch-action:pan-x}#item-continuity-study .ic-day{position:absolute;top:0;left:0;overflow:hidden;min-height:0;padding:0;text-align:left;will-change:transform,width,height}#item-continuity-study .ic-date{position:absolute;left:10px;top:10px;font-family:Georgia,serif;font-size:20px}#item-continuity-study .ic-weekday{position:absolute;left:40px;top:15px;color:var(--v-dim);font-size:12px}#item-continuity-study .ic-work{position:absolute;left:105px;top:10px;right:10px;padding:9px 10px;background:var(--v-green);border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}#item-continuity-study .ic-detail{position:absolute;left:18px;right:18px;top:100px;display:grid;gap:22px;font-size:16px}#item-continuity-study .ic-detail span{border-top:1px solid var(--v-line);padding-top:18px}#item-continuity-study .ic-detail small{display:block;color:var(--v-dim);font-size:12px;margin-bottom:10px}#item-continuity-study .ic-mark{position:absolute;left:10px;top:42px;width:16px;height:4px;border-radius:4px;background:var(--v-mark)}#item-continuity-study .ic-depth{margin-top:20px;display:grid;gap:10px}#item-continuity-study input{width:100%;accent-color:var(--v-mark)}#item-continuity-study .ic-footer{margin-top:10px;color:var(--v-dim);font-size:11px}@media(max-width:420px){#item-continuity-study{padding:12px}#item-continuity-study h3{font-size:21px}#item-continuity-study .ic-date{left:7px}#item-continuity-study .ic-work{left:89px}#item-continuity-study .ic-weekday{left:35px}}
</style>
<style>
#item-continuity-study .ic-day{z-index:1}#item-continuity-study .ic-object{position:absolute;top:0;left:0;z-index:5;overflow:hidden;box-sizing:border-box;background:var(--v-green);border-radius:5px;will-change:transform,width,height;isolation:isolate}
#item-continuity-study .ic-object[data-kind=read]{--v-green:light-dark(#e9dfc9,#584e36)}
#item-continuity-study .ic-object-title{position:absolute;top:0;bottom:0;left:0;right:0;border:0;background:transparent;min-height:0;padding:0 6px;text-align:left;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12px Arial,sans-serif;opacity:1;color:var(--v-ink)}
#item-continuity-study .ic-object-title:disabled{cursor:default;opacity:1;color:var(--v-ink)}
#item-continuity-study .ic-check{position:absolute;left:0;top:0;bottom:0;width:44px;padding:0;min-height:0;border:0;background:transparent;display:grid;place-content:center;border-radius:0;transform-origin:center;z-index:2}
#item-continuity-study .ic-check span{width:21px;height:21px;border:1px solid var(--v-mark);border-radius:50%;display:grid;place-content:center;font-size:13px;color:var(--v-ink)}
#item-continuity-study .ic-check[aria-pressed=true]{background:transparent;border:0}#item-continuity-study .ic-check[aria-pressed=true] span{background:var(--v-green)}
#item-continuity-study .ic-meta{position:absolute;left:44px;bottom:13px;font-size:12px;color:var(--v-dim);white-space:nowrap;pointer-events:none}
#item-continuity-study .ic-date{font-size:17px}#item-continuity-study #ic-stage{touch-action:pan-y}#item-continuity-study .ic-weekday{left:37px;top:14px}
</style>
<script>
(()=>{
 const root=document.getElementById('item-continuity-study'),stage=root.querySelector('#ic-stage'),range=root.querySelector('#ic-depth'),reduce=matchMedia('(prefers-reduced-motion: reduce)'),opts={duration:900,rowStyle:'Plain checklist'};
 const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],work=['Strength','Reading','Thesis outline','Tempo run','Reading','Long run','Weekly review'];
 let selected=17,depth=0,mode='anchor',raf=0;const items=[],days=[];const completed=new Set();
 for(let i=0;i<35;i++){
  const date=document.createElement('button');date.type='button';date.className='ic-day';date.disabled=i<1||i>30;date.setAttribute('aria-label',(i<1?'August 31':i>30?'October '+(i-30):'September '+i)+', '+names[i%7]);date.innerHTML='<span class="ic-date">'+(i<1?31:i>30?i-30:i)+'</span><span class="ic-weekday">'+names[i%7]+'</span>';date.onclick=()=>navigate(i,depth<.5?1:2);stage.appendChild(date);days.push(date);
  if(i<1||i>30)continue;
  [work[i%7],work[i%7]==='Reading'?'Evening walk':i%2?'Reading':'Evening walk'].forEach((title,j)=>{
   const el=document.createElement('div'),key=i+'-'+j;el.className='ic-object';el.dataset.key=key;el.dataset.kind=title==='Reading'?'read':'work';el.setAttribute('role','group');el.setAttribute('aria-label',title+', September '+i);
   const label=document.createElement('button');label.type='button';label.className='ic-object-title';label.textContent=title;label.setAttribute('aria-label','Open '+title+' on September '+i);label.onclick=()=>navigate(i,depth<.5?1:2);
   const check=document.createElement('button');check.type='button';check.className='ic-check';check.innerHTML='<span></span>';check.setAttribute('aria-label','Complete '+title+' on September '+i);check.setAttribute('aria-pressed','false');check.onclick=()=>{if(completed.has(key))completed.delete(key);else completed.add(key);paint(depth);root.querySelector('#ic-status').textContent=(completed.has(key)?'Completed ':'Undid ')+title+' · demo only';};
   const meta=document.createElement('span');meta.className='ic-meta';meta.textContent=j?'20 minutes · planned':'30 minutes · planned';el.append(label,check,meta);stage.appendChild(el);items.push({el,label,check,meta,i,j,key,title});
  });
 }
 const mix=(a,b,t)=>a+(b-a)*t,clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>x*x*(3-2*x),blend=(a,b,t)=>Object.fromEntries(Object.keys(a).map(k=>[k,mix(a[k],b[k],t)]));
 function endpoints(i){const W=stage.clientWidth,H=490,g=6,mw=(W-6*g)/7,mh=(H-4*g)/5,wh=(H-6*g)/7;return{m:{x:i%7*(mw+g),y:Math.floor(i/7)*(mh+g),w:mw,h:mh},w:{x:0,y:(i-Math.floor(selected/7)*7)*(wh+g),w:W,h:wh},d:{x:0,y:(i-selected)*(H+g),w:W,h:H}};}
 function geom(i,j,d){let {m,w,d:day}=endpoints(i);if(j!==null){m={x:m.x+3,y:m.y+32+j*25,w:m.w-6,h:21};w={x:70,y:w.y+7+j*27,w:w.w-80,h:23};day={x:14,y:day.y+95+j*90,w:day.w-28,h:76};}
  if(d>=1)return blend(w,day,d-1);
  if(mode==='anchor'){const p=blend(m,w,d);p.x+=Math.sin(d*Math.PI)*(i%7-selected%7)*Math.min(5,stage.clientWidth/80);return p;}
  const spine=j===null?{x:0,y:w.y,w:62,h:w.h}:{x:70,y:w.y,w:Math.max(m.w,Math.min(172,w.w)),h:w.h};return d<.48?blend(m,spine,smooth(d/.48)):blend(spine,w,smooth((d-.48)/.52));
 }
 function place(el,p){el.style.transform='translate('+p.x+'px,'+p.y+'px)';el.style.width=Math.max(1,p.w)+'px';el.style.height=Math.max(1,p.h)+'px';const visible=p.x+p.w>0&&p.x<stage.clientWidth&&p.y+p.h>0&&p.y<490;el.inert=!visible;el.setAttribute('aria-hidden',String(!visible));}
 function paint(d){depth=d;const t=clamp(d-1);days.forEach((el,i)=>{const p=geom(i,null,d);place(el,p);el.setAttribute('aria-pressed',String(i===selected));el.style.background=i===selected?'color-mix(in srgb, var(--v-green) '+(35*(1-t))+'%, var(--v-paper))':'var(--v-paper)';el.querySelector('.ic-weekday').style.opacity=clamp((p.w-55)/45);});
  items.forEach(item=>{const {el,label,check,meta,i,j,key}=item,p=geom(i,j,d);place(el,p);el.style.zIndex=i===selected?10:5;el.style.borderRadius=mix(5,0,t)+'px';const tint=opts.rowStyle==='Retain tint'?100:100*(1-t);el.style.background='color-mix(in srgb, var(--v-green) '+tint+'%, var(--v-paper))';el.style.borderBottom='1px solid color-mix(in srgb, var(--v-line) '+(t*100)+'%, transparent)';
   label.style.left=(44*t)+'px';label.style.paddingLeft=mix(5,0,t)+'px';label.style.fontSize=mix(12,15,t)+'px';label.style.paddingBottom=(20*t)+'px';label.disabled=t>.99;check.style.clipPath='inset(0 '+((1-t)*100)+'% 0 0)';check.inert=t<.99;check.setAttribute('aria-hidden',String(t<.99));check.setAttribute('aria-pressed',String(completed.has(key)));check.firstElementChild.textContent=completed.has(key)?'✓':'';meta.style.opacity=clamp((t-.5)*2);el.dataset.complete=String(completed.has(key));
  });range.value=d;root.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(+b.dataset.level-d)<.03)));root.querySelector('#ic-heading').textContent=d<.5?'September 2026':d<1.5?'September '+Math.max(1,Math.floor(selected/7)*7)+'–'+Math.min(30,Math.floor(selected/7)*7+6):names[selected%7]+', September '+selected;root.querySelector('#ic-caption').textContent=d<.5?'Tap a named pill or a date':d<1.5?'The same pills · tap to open the day':'The same items · checkbox completes';root.querySelector('#ic-prev').disabled=selected===1;root.querySelector('#ic-next').disabled=selected===30;
 }
 function go(to){cancelAnimationFrame(raf);const from=depth,start=performance.now();function tick(now){const t=reduce.matches?1:Math.min(1,(now-start)/opts.duration);paint(mix(from,to,smooth(t)));if(t<1)raf=requestAnimationFrame(tick);else root.querySelector('#ic-status').textContent='September '+selected+' · '+['Month','Vertical week','Day checklist'][to];}raf=requestAnimationFrame(tick);}
 function navigate(date,to){cancelAnimationFrame(raf);selected=date;go(to);}
 root.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>go(+b.dataset.level));root.querySelector('#ic-concept').onchange=e=>{cancelAnimationFrame(raf);mode=e.target.value;paint(0)};range.oninput=()=>{cancelAnimationFrame(raf);paint(+range.value)};range.onchange=()=>go(Math.round(+range.value));root.querySelector('#ic-prev').onclick=()=>navigate(Math.max(1,selected-1),Math.round(depth));root.querySelector('#ic-next').onclick=()=>navigate(Math.min(30,selected+1),Math.round(depth));new ResizeObserver(()=>paint(depth)).observe(stage);paint(0);
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>paint(depth)});tweak.addSlider(opts,'duration',{label:'Inspection duration',min:250,max:1500,step:50,unit:'ms'});tweak.addSelect(opts,'rowStyle',{label:'Day row appearance',options:['Plain checklist','Retain tint']});}
})();
</script>
