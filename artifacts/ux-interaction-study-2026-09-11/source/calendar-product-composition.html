  </div>
 </div>

</div>

<script>
(()=>{
const root=document.getElementById('calendar-product-study'),stage=root.querySelector('#cp-stage'),range=root.querySelector('#cp-depth'),editor=root.querySelector('#cp-editor'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const opts={duration:850,motion:'Anchor'},names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],goals={run:'Tempo run',read:'Reading',strength:'Strength',thesis:'Thesis outline',walk:'Evening walk'},pattern=['strength','read','thesis','run','read','run','walk'];

const occurrences=[],dates=[],headers=[],calItems=[],rows=[];
for(let day=1;day<=30;day++)[pattern[day%7],pattern[day%7]==='read'?'walk':'read'].forEach((goal,j)=>occurrences.push({id:day+'-'+j,day,goal,locked:false,done:false}));
function rowNode(o,calendar){const el=document.createElement('div');el.className=calendar?'cp-item':'cp-row';el.dataset.id=o.id;el.dataset.goal=o.goal;const title=document.createElement('button');title.type='button';title.className='cp-item-title';title.onclick=()=>openEditor(o.id,title);const check=document.createElement('button');check.type='button';check.className='cp-complete';check.innerHTML='<span></span>';check.onclick=()=>{o.done=!o.done;paint();status((o.done?'Completed ':'Undid ')+goals[o.goal]+' · demo only');};const meta=document.createElement('span');meta.className='cp-item-meta';el.append(title,check,meta);stage.appendChild(el);return{el,title,check,meta,o};}
for(let i=0;i<35;i++){const el=document.createElement('button');el.type='button';el.className='cp-date';el.innerHTML='<span class="cp-date-number">'+(i<1?31:i>30?i-30:i)+'</span>';el.disabled=i<1||i>30;el.setAttribute('aria-label','Select September '+i);el.onclick=()=>{if(editId)closeEditor(true);selected=i;paint();status('September '+i+' selected');};stage.appendChild(el);dates.push(el);}
for(let i=0;i<7;i++){const el=document.createElement('span');el.className='cp-weekday';el.textContent=names[i];stage.appendChild(el);headers.push(el);}

const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,t)=>a+(b-a)*t,smooth=t=>t*t*(3-2*t),blend=(a,b,t)=>Object.fromEntries(Object.keys(a).map(k=>[k,mix(a[k],b[k],t)]));
function status(t){root.querySelector('#cp-status').textContent=t;}
function facts(){const W=stage.clientWidth,mobile=W<680,cw=mobile?W:W*.61,gap=20,dayT=clamp(depth-1),shelf=editId&&editorMode==='shelf'?280*editProgress:0,seam=editId&&editorMode==='seam'?280*editProgress:0,row=editId&&editorMode==='row'?280*editProgress:0,chosen=occurrences.filter(o=>o.day===selected),idx=Math.max(0,chosen.findIndex(o=>o.id===editId)),sr=Math.floor(selected/7);return{W,mobile,cw,gap,t:dayT,shelf,seam,row,chosen,idx,sr};}
function calendarDate(i,s){const m={x:i%7*s.cw/7,y:34+Math.floor(i/7)*94,w:s.cw/7-4,h:89},w={x:0,y:(i-s.sr*7)*67,w:s.cw,h:62};const d={x:0,y:70+(i-selected)*530,w:s.W,h:410};let p=depth<1?blend(m,w,depth):blend(w,d,s.t);

if(s.seam){const afterMonth=Math.floor(i/7)>s.sr,afterWeek=i>selected;const push=depth<1?mix(afterMonth?1:0,afterWeek?1:0,depth):1;p.y+=s.seam*push;}p.y+=s.shelf;return p;}
function panel(s){const a={x:s.mobile?0:s.cw+s.gap,y:(s.mobile?530+s.seam:0)+s.shelf,w:s.mobile?s.W:s.W-s.cw-s.gap,h:Math.max(300,105+s.chosen.length*70)+s.row};const b={x:0,y:s.shelf,w:s.W,h:480+s.row+s.seam};if(dayMode==='reuse')return blend(a,b,s.t);return{...a,x:a.x+(s.mobile?0:s.W-a.x)*s.t,y:a.y+(s.mobile?500:0)*s.t};}
function mainRow(o,s,index){const p=panel(s);let y=p.y+98+index*70;if(editorMode==='row'&&editId&&index>s.idx)y+=s.row;if(dayMode==='reuse')y+=s.seam*s.t;return{x:p.x+14,y,w:p.w-28,h:64};}
function calendarItem(o,s){const index=occurrences.filter(x=>x.day===o.day).findIndex(x=>x.id===o.id),base=calendarDate(o.day,s),m={x:o.day%7*s.cw/7+3,y:34+Math.floor(o.day/7)*94+31+index*25,w:s.cw/7-10,h:21},w={x:65,y:(o.day-s.sr*7)*67+7+index*27,w:s.cw-76,h:23};let p;
if(depth<1){if(opts.motion==='Ribbon'){const mid={x:65,y:w.y,w:Math.max(m.w,Math.min(175,w.w)),h:23};p=depth<.5?blend(m,mid,smooth(depth*2)):blend(mid,w,smooth((depth-.5)*2));}else p=blend(m,w,depth);p.y+=s.shelf;if(s.seam)p.y+=s.seam*mix(Math.floor(o.day/7)>s.sr?1:0,o.day>selected?1:0,depth);}
else{const target={x:16,y:102+index*82+(o.day-selected)*530,w:s.W-32,h:72};p=blend(w,target,s.t);p.y+=s.shelf+s.seam*s.t;if(s.seam&&o.day>selected)p.y+=s.seam*(1-s.t);if(s.row&&index>s.idx)p.y+=s.row*s.t;}
if(dayMode==='reuse'&&depth>1){p.x-=s.cw*s.t;p.y-=80*s.t;}return p;}
function setBox(el,p,visible=true){el.style.transform='translate('+p.x+'px,'+p.y+'px)';el.style.width=Math.max(1,p.w)+'px';el.style.height=Math.max(1,p.h)+'px';el.style.visibility=visible?'visible':'hidden';el.inert=!visible;el.setAttribute('aria-hidden',String(!visible));}
function paint(){const s=facts(),p=panel(s),editing=Boolean(editId);let H=s.mobile?Math.max(530+s.seam,p.y+p.h):Math.max(510+s.seam+s.shelf,p.y+p.h);H=mix(H,Math.max(500+s.row+s.seam+s.shelf,500),s.t);stage.style.height=Math.ceil(H)+'px';
setBox(root.querySelector('#cp-calendar-surface'),{x:dayMode==='reuse'?-s.cw*s.t:0,y:s.shelf,w:mix(s.cw,s.W,dayMode==='unfold'?s.t:0),h:510+s.seam},s.t<1||dayMode==='unfold');
setBox(root.querySelector('#cp-checklist-surface'),p,dayMode==='reuse'||s.t<1);
const heading=root.querySelector('#cp-panel-heading');setBox(heading,{x:p.x+18,y:p.y+18,w:p.w-36,h:64},dayMode==='reuse'||s.t<1);root.querySelector('#cp-panel-date').textContent=selected+' September';root.querySelector('#cp-panel-caption').style.opacity=1-s.t;
for(let i=0;i<35;i++){let q=calendarDate(i,s);if(dayMode==='reuse'&&s.t>0){q.x-=s.cw*s.t;q.y-=80*s.t;}const count=occurrences.filter(o=>o.day===i).length;let badge=dates[i].querySelector('.cp-overflow');if(!badge){badge=document.createElement('span');badge.className='cp-overflow';badge.style.cssText='position:absolute;right:3px;top:8px;font-size:11px';dates[i].appendChild(badge);}badge.textContent=count>2?'+'+(count-2):'';const on=depth<1||i>=s.sr*7&&i<s.sr*7+7;setBox(dates[i],q,on&&(s.t<1||dayMode==='unfold'&&i===selected));dates[i].setAttribute('aria-pressed',String(i===selected));if(s.t>0&&dayMode==='unfold')dates[i].style.opacity=1-s.t;else dates[i].style.opacity=1;}
headers.forEach((el,i)=>{const weekDay=s.sr*7+i,m={x:i*s.cw/7+8,y:7,w:s.cw/7,h:20},w={x:7,y:i*67+35,w:53,h:20};let q=depth<1?blend(m,w,depth):blend(w,{x:i===selected%7?18:mix(w.x,-100,s.t),y:i===selected%7?24:-50,w:100,h:20},s.t);q.y+=s.shelf;if(s.seam)q.y+=s.seam*(weekDay>selected?Math.min(depth,1)*(1-s.t):0);if(depth<1)q.x+=opts.motion==='Ribbon'?Math.sin(depth*Math.PI)*4:0;setBox(el,q,depth<2||i===selected%7);el.style.fontSize=mix(12,16,s.t)+'px';});
calItems.forEach(n=>{const q=calendarItem(n.o,s),inWeek=n.o.day>=s.sr*7&&n.o.day<s.sr*7+7,visible=(depth<1||inWeek)&&(s.t<1||dayMode==='unfold'&&n.o.day===selected)&&(depth>=2||occurrences.filter(o=>o.day===n.o.day).indexOf(n.o)<2);updateNode(n,q,visible,dayMode==='unfold'?s.t:0);});
rows.forEach(n=>{const idx=s.chosen.indexOf(n.o),q=mainRow(n.o,s,Math.max(0,idx));updateNode(n,q,idx>=0&&(dayMode==='reuse'||s.t<1),1);});
setBox(root.querySelector('#cp-empty'),{x:dayMode==='reuse'?p.x+18:18,y:dayMode==='reuse'?p.y+110:110+s.shelf,w:Math.max(180,p.w-36),h:25},s.chosen.length===0&&(dayMode==='reuse'||s.t===1));
if(editing){let q;if(editorMode==='shelf')q={x:0,y:0,w:s.W,h:264};else if(editorMode==='seam'){const monthY=34+(s.sr+1)*94,weekY=(selected-s.sr*7+1)*67;q={x:0,y:depth<1?mix(monthY,weekY,depth):mix(weekY,72,s.t),w:mix(s.cw,s.W,s.t),h:264};}else{const initial=mainRow(s.chosen[s.idx],s,s.idx),row=dayMode==='unfold'?blend(initial,calendarItem(s.chosen[s.idx],s),s.t):initial;q={x:row.x,y:row.y+row.h+4,w:row.w,h:264};}setBox(editor,q);editor.style.clipPath='inset(0 0 '+((1-editProgress)*100)+'% 0)';editor.inert=editProgress<.99;}

}
function updateNode(n,q,visible,rowT){setBox(n.el,q,visible);n.title.textContent=goals[n.o.goal];n.title.setAttribute('aria-label','Edit '+goals[n.o.goal]+' on September '+n.o.day);n.el.classList.toggle('is-focused',n.o.id===editId);n.el.style.zIndex=n.o.day===selected?7:5;n.title.style.left=(36*rowT)+'px';n.title.style.paddingBottom=(18*rowT)+'px';n.title.style.fontSize=mix(12,14,rowT)+'px';n.check.style.clipPath='inset(0 '+((1-rowT)*100)+'% 0 0)';n.check.inert=rowT<.99;n.check.setAttribute('aria-hidden',String(rowT<.99));n.check.setAttribute('aria-label',(n.o.done?'Undo ':'Complete ')+goals[n.o.goal]);n.check.setAttribute('aria-pressed',String(n.o.done));n.check.firstElementChild.textContent=n.o.done?'✓':'';n.meta.textContent=(n.o.locked?'Locked · ':'')+'Planned session';n.meta.style.opacity=rowT;n.el.style.borderRadius=mix(5,0,rowT)+'px';if(n.el.classList.contains('cp-item')){n.el.style.background='color-mix(in srgb, '+(n.o.goal==='read'?'var(--cp-purple)':'var(--cp-blue)')+' '+(100*(1-rowT))+'%, var(--cp-paper))';n.el.style.borderBottom='1px solid color-mix(in srgb, var(--cp-line) '+(100*rowT)+'%, transparent)';}}
function go(to){cancelAnimationFrame(raf);const from=depth,start=performance.now();function tick(now){const t=reduced.matches?1:clamp((now-start)/opts.duration);depth=mix(from,to,smooth(t));paint();if(t<1)raf=requestAnimationFrame(tick);else status(['Month','Vertical week','Day'][to]+' · September '+selected);}raf=requestAnimationFrame(tick);}
