<div id="goal-experience-study" aria-label="Interactive goal experience concepts">
 <div class="gx-top"><span>GOALS · INTERACTION STUDY</span><span>Sample data · changes stay in this demo</span></div>
 <label class="gx-picker">Experience <select id="gx-mode"><option value="folio">Living folio · open</option><option value="weave">Rhythm weave · scrub</option><option value="map">Goal constellation · trace</option><option value="studio">Evidence studio · collect</option></select></label>
 <div id="gx-main"></div><div id="gx-message" class="gx-message" aria-live="polite"></div>
</div>
<style>
#goal-experience-study{--g-bg:light-dark(#f4f1e8,#25271f);--g-paper:light-dark(#fffdf6,#33372b);--g-text:light-dark(#333c2e,#e9ecdf);--g-dim:light-dark(#626d58,#bdc6af);--g-line:light-dark(#d4d9c6,#515e43);--g-fill:light-dark(#dce7cb,#455a33);--g-mark:light-dark(#567340,#b9d29f);--g-warm:light-dark(#eadfc7,#584b32);--g-shadow:light-dark(#3d4a2414,#00000030);font:14px Arial,sans-serif;color:var(--g-text);background:var(--g-bg);padding:22px;border-radius:16px}
#goal-experience-study *{box-sizing:border-box}#goal-experience-study button,#goal-experience-study select,#goal-experience-study input,#goal-experience-study textarea{font:inherit;color:inherit}#goal-experience-study button,#goal-experience-study select{background:var(--g-paper);border:1px solid var(--g-line);padding:10px 13px;border-radius:7px;min-height:44px;cursor:pointer}#goal-experience-study button[aria-pressed=true]{background:var(--g-fill);border-color:var(--g-mark)}#goal-experience-study button:disabled{opacity:.55;cursor:default}#goal-experience-study .gx-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.07em;color:var(--g-dim);margin-bottom:18px}#goal-experience-study .gx-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}#goal-experience-study h3{font:400 28px Georgia,serif;margin:24px 0 10px}#goal-experience-study h4{font:400 19px Georgia,serif;margin:0 0 10px}#goal-experience-study small{font-size:12px;color:var(--g-dim)}#goal-experience-study .gx-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}#goal-experience-study .gx-covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}#goal-experience-study .gx-cover{min-height:206px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:14px;background:var(--g-paper);border-radius:3px 12px 12px 3px;border-left:8px solid var(--g-mark);box-shadow:4px 6px 0 var(--g-shadow);padding:18px 14px;transition:transform 250ms}#goal-experience-study .gx-cover:hover{transform:translateY(-5px)}#goal-experience-study .gx-cover strong{font:400 22px Georgia,serif}#goal-experience-study .gx-cover small{margin-top:auto}#goal-experience-study .gx-stamps{display:flex;gap:5px;flex-wrap:wrap}#goal-experience-study .gx-stamp{width:13px;height:13px;border-radius:50%;background:var(--g-fill)}#goal-experience-study .gx-stamp.done{background:var(--g-mark)}#goal-experience-study .gx-page{background:var(--g-paper);padding:26px;border-left:7px solid var(--g-mark);box-shadow:4px 6px 0 var(--g-shadow);transform-origin:top left}#goal-experience-study .gx-page h3{margin-top:12px}#goal-experience-study .gx-page p{line-height:1.65;max-width:46ch}#goal-experience-study .gx-page hr{border:0;border-top:1px solid var(--g-line);margin:22px 0}#goal-experience-study .gx-entries{display:grid;gap:12px;margin-top:16px}#goal-experience-study .gx-entry{display:flex;gap:15px;align-items:center;padding:10px 0;border-bottom:1px solid var(--g-line)}#goal-experience-study .gx-entry time{color:var(--g-dim);min-width:48px}#goal-experience-study .gx-message{font-size:12px;color:var(--g-dim);margin-top:16px;min-height:16px}#goal-experience-study .gx-weave{margin:25px 0;display:grid;gap:10px}#goal-experience-study .gx-strand{display:grid;grid-template-columns:115px 1fr;gap:15px;align-items:center;background:transparent;border:0;text-align:left;padding:12px 0;width:100%}#goal-experience-study .gx-thread{height:34px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:center;position:relative}#goal-experience-study .gx-thread:before{content:'';height:1px;background:var(--g-line);position:absolute;left:0;right:0;top:50%}#goal-experience-study .gx-stitch{height:8px;background:var(--g-line);border-radius:6px;position:relative}#goal-experience-study .gx-stitch.done{height:24px;background:var(--g-mark)}#goal-experience-study .gx-stitch.chosen{outline:2px solid var(--g-text);outline-offset:3px}#goal-experience-study .gx-scrub{display:grid;gap:14px;margin-top:20px}#goal-experience-study input[type=range]{width:100%;accent-color:var(--g-mark)}#goal-experience-study .gx-detail{border-top:1px solid var(--g-line);padding-top:20px;margin-top:18px}#goal-experience-study .gx-map{position:relative;height:370px;margin-top:16px}#goal-experience-study .gx-map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#goal-experience-study .gx-map line{stroke:var(--g-line);stroke-width:2}#goal-experience-study .gx-map line.active{stroke:var(--g-mark);stroke-width:4}#goal-experience-study .gx-node{position:absolute;transform:translate(-50%,-50%);width:128px;min-height:76px;border-radius:16px;box-shadow:0 6px 15px var(--g-shadow);display:grid;gap:6px;padding:10px}#goal-experience-study .gx-node span{font-family:Georgia,serif;font-size:17px}#goal-experience-study .gx-collection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:22px}#goal-experience-study .gx-evidence{text-align:left;padding:0;overflow:hidden;background:var(--g-paper);border-radius:3px;box-shadow:2px 5px 0 var(--g-shadow)}#goal-experience-study .gx-art{height:118px;background:var(--g-fill);display:grid;place-content:center;padding:15px;font:400 25px Georgia,serif;text-align:center;white-space:pre-line}#goal-experience-study .gx-evidence:nth-child(2n) .gx-art{background:var(--g-warm)}#goal-experience-study .gx-evidence footer{display:grid;gap:7px;padding:15px}#goal-experience-study .gx-receipt{background:var(--g-paper);padding:26px;margin-top:22px;box-shadow:2px 5px 0 var(--g-shadow)}#goal-experience-study blockquote{font:400 23px/1.6 Georgia,serif;margin:22px 0}#goal-experience-study .gx-form{display:grid;gap:12px;border-top:1px solid var(--g-line);margin-top:24px;padding-top:20px}#goal-experience-study .gx-form label{display:grid;gap:7px}#goal-experience-study textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--g-line);border-radius:6px;background:var(--g-paper);padding:12px}#goal-experience-study select{max-width:100%}@media(max-width:540px){#goal-experience-study{padding:14px}#goal-experience-study .gx-covers,#goal-experience-study .gx-collection{grid-template-columns:repeat(2,minmax(0,1fr))}#goal-experience-study .gx-cover{min-height:180px;padding:14px 10px}#goal-experience-study .gx-cover strong{font-size:20px}#goal-experience-study .gx-strand{grid-template-columns:80px 1fr;gap:12px}#goal-experience-study .gx-thread{gap:3px}#goal-experience-study .gx-node{width:104px}#goal-experience-study .gx-node span{font-size:15px}#goal-experience-study .gx-page{padding:18px}#goal-experience-study .gx-art{font-size:21px}#goal-experience-study select,#goal-experience-study textarea{font-size:16px}}@media(prefers-reduced-motion:reduce){#goal-experience-study .gx-cover{transition:none}#goal-experience-study .gx-cover:hover{transform:none}}
</style>
<script>
(()=>{const root=document.getElementById('goal-experience-study'),main=root.querySelector('#gx-main'),msg=root.querySelector('#gx-message'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),prefs={motion:true};
const goals=[{name:'Tempo run',why:'Feel strong and free on longer runs.',target:8,days:[4,7,10,14],next:'A comfortable 12 km',parent:4},{name:'Strength',why:'Build a body I can rely on.',target:8,days:[5,8,12,16],next:'Three consistent training weeks',parent:4},{name:'Read',why:'Make room for ideas outside my everyday work.',target:12,days:[4,5,7,9,11,14,16],next:'Finish The Creative Act'},{name:'Thesis',why:'Turn a question I care about into something useful.',target:12,days:[5,8,10,13,15],next:'Complete the first chapter'},{name:'Move regularly',why:'Keep movement part of my everyday life.',target:16,days:[],next:'Keep a sustainable weekly rhythm'}];
const evidence=[{g:0,day:14,title:'The longer loop',art:'12 km\nby the river',note:'Found a pace I could hold. Finished with more left in the tank.'},{g:3,day:15,title:'The argument clicked',art:'Chapter 01\nTaking shape',note:'The central argument finally fits on one page.'},{g:2,day:16,title:'A line to keep',art:'Make room\nfor wonder',note:'Twenty minutes of reading made the evening feel wider.'},{g:1,day:16,title:'Showing up',art:'Session 04\nStronger',note:'Same weight, steadier movement. Small progress I could feel.'},{g:0,day:10,title:'Back outside',art:'An easy\nreturn',note:'A quiet run after a busy stretch. Glad I went.'},{g:3,day:13,title:'A useful hour',art:'One page\nfurther',note:'Wrote the transition I had been avoiding.'}];let mode='folio',focus=null,day=17,receipt=null,adding=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logs(i){return [...new Set([...goals[i].days,...goals.flatMap((g,j)=>g.parent===i?logs(j):[])])].sort((a,b)=>a-b)}
function stamps(i){return '<div class="gx-stamps" aria-label="'+logs(i).length+' of '+goals[i].target+' sessions">'+Array.from({length:goals[i].target},(_,j)=>'<span class="gx-stamp '+(j<logs(i).length?'done':'')+'"></span>').join('')+'</div>'}
function announce(t){msg.textContent=t}function animate(el,rect){if(!prefs.motion||reduced.matches||!el)return;const b=el.getBoundingClientRect();el.animate(rect?[{transform:'translate('+(rect.x-b.x)+'px,'+(rect.y-b.y)+'px) scale('+rect.width/b.width+','+rect.height/b.height+')'},{transform:'none'}]:[{transform:'translateY(12px)'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});}
function toggle(i,d){const g=goals[i],exists=g.days.includes(d);g.days=exists?g.days.filter(x=>x!==d):[...g.days,d];render();announce((exists?'Removed':'Logged')+' September '+d+' for '+g.name+(g.parent!==undefined?'; linked Move regularly progress updated.':'.'));animate(main.querySelector('.gx-page,.gx-detail'));}
function folio(){if(focus===null){main.innerHTML='<h3>Your ongoing stories</h3><small>Open a goal</small><div class="gx-covers">'+goals.map((g,i)=>'<button class="gx-cover" data-open="'+i+'"><small>VOL. 0'+(i+1)+'</small><strong>'+g.name+'</strong>'+stamps(i)+'<small>'+logs(i).length+' / '+g.target+' sessions this month</small></button>').join('')+'</div>';}else{const g=goals[focus];main.innerHTML='<div class="gx-bar"><button data-back>← All goals</button><small>Living folio · September</small></div><article class="gx-page"><small>VOL. 0'+(focus+1)+'</small><h3>'+g.name+'</h3><p>'+g.why+'</p>'+stamps(focus)+'<p>'+logs(focus).length+' of '+g.target+' sessions this month</p><hr><small>Next milestone</small><h4>'+g.next+'</h4><div class="gx-entries">'+logs(focus).slice(-3).reverse().map(d=>'<div class="gx-entry"><time>Sep '+d+'</time><span>A session added to your story</span></div>').join('')+'</div>'+(focus===4?'<p><small>Includes sessions linked from Tempo run and Strength.</small></p>':'<div class="gx-bar"><button data-log="'+focus+'">'+(goals[focus].days.includes(17)?'Undo today’s session':'Log today’s session')+'</button></div>')+'</article>';}}
function weave(){const ids=focus===null?[0,1,2,3,4]:[focus];main.innerHTML='<div class="gx-bar"><h3>'+(focus===null?'The shape of your days':goals[focus].name)+'</h3>'+(focus!==null?'<button data-back>← All goals</button>':'')+'</div><small>September 4–17 · filled stitches are logged sessions</small><div class="gx-weave">'+ids.map(i=>'<button class="gx-strand" data-open="'+i+'"><span>'+goals[i].name+'</span><span class="gx-thread">'+Array.from({length:14},(_,n)=>'<span class="gx-stitch '+(logs(i).includes(n+4)?'done ':'')+(day===n+4?'chosen':'')+'"></span>').join('')+'</span></button>').join('')+'</div><label class="gx-scrub">Scrub time · September <output id="gx-day">'+day+'</output><input id="gx-time" type="range" min="4" max="17" value="'+day+'"></label><div class="gx-detail" id="gx-reading"></div>';reading();main.querySelector('#gx-time').oninput=e=>{day=+e.target.value;main.querySelector('#gx-day').textContent=day;main.querySelectorAll('.gx-thread').forEach(el=>[...el.children].forEach((s,j)=>s.classList.toggle('chosen',j+4===day)));reading();};}
function reading(){const ids=focus===null?[0,1,2,3]:[focus],hit=ids.filter(i=>logs(i).includes(day));main.querySelector('#gx-reading').innerHTML='<h4>September '+day+'</h4><p>'+(hit.length?hit.map(i=>goals[i].name).join(' · '):'No sessions logged')+'</p>'+(focus!==null&&focus!==4?'<button id="gx-weave-log">'+(goals[focus].days.includes(day)?'Remove this session':'Log a session here')+'</button>':'<small>'+(focus===4?'Includes linked sessions.':'Select a strand to inspect one goal.')+'</small>');const b=main.querySelector('#gx-weave-log');if(b)b.onclick=()=>toggle(focus,day);}
function map(){const pos=[[23,46],[77,46],[77,86],[23,86],[50,12]];main.innerHTML='<h3>Effort that connects</h3><small>Illustrative links · Run and Strength both contribute to Move regularly</small><div class="gx-map"><svg aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="23" y1="46" x2="50" y2="12" class="'+([0,4].includes(focus)?'active':'')+'"/><line x1="77" y1="46" x2="50" y2="12" class="'+([1,4].includes(focus)?'active':'')+'"/></svg>'+goals.map((g,i)=>'<button class="gx-node" data-open="'+i+'" aria-pressed="'+(focus===i)+'" style="left:'+pos[i][0]+'%;top:'+pos[i][1]+'%"><span>'+g.name+'</span><small>'+logs(i).length+' / '+g.target+'</small></button>').join('')+'</div><div class="gx-detail">'+(focus===null?'<h4>Select a goal to trace its connections</h4>':'<h4>'+goals[focus].name+'</h4><p>'+goals[focus].why+'</p><div class="gx-bar">'+(goals[focus].parent!==undefined?'<button data-open="4">Follow link → Move regularly</button>':focus===4?'<button data-open="0">← Tempo run</button><button data-open="1">← Strength</button>':'<small>Independent goal · no linked goals</small>')+(focus!==4?'<button data-log="'+focus+'">'+(goals[focus].days.includes(17)?'Undo today’s session':'Log today’s session')+'</button>':'')+'</div>')+'</div>';}
function studio(){if(receipt!==null){const e=evidence[receipt];main.innerHTML='<div class="gx-bar"><button id="gx-close-receipt">← Collection</button><button data-open="'+e.g+'">'+goals[e.g].name+'</button></div><article class="gx-receipt"><small>'+goals[e.g].name+' · September '+e.day+'</small><h3>'+esc(e.title)+'</h3><div class="gx-art">'+esc(e.art)+'</div><blockquote>'+esc(e.note)+'</blockquote><small>Evidence from an ongoing goal</small></article>';main.querySelector('#gx-close-receipt').onclick=()=>{receipt=null;render()};return;}
main.innerHTML='<div class="gx-bar"><h3>'+(focus===null?'Look what you’re building':goals[focus].name)+'</h3>'+(focus!==null?'<button data-back>← All goals</button>':'')+'</div><label class="gx-picker">Collection <select id="gx-filter"><option value="all">All goals</option>'+goals.map((g,i)=>'<option value="'+i+'" '+(focus===i?'selected':'')+'>'+g.name+'</option>').join('')+'</select></label><div class="gx-collection">'+evidence.map((e,i)=>focus!==null&&focus!==e.g?'':'<button class="gx-evidence" data-receipt="'+i+'"><div class="gx-art">'+esc(e.art)+'</div><footer><span>'+esc(e.title)+'</span><small>'+goals[e.g].name+' · Sep '+e.day+'</small></footer></button>').join('')+'</div>'+(focus!==null&&!evidence.some(e=>e.g===focus)?'<p>No evidence collected for this goal yet.</p>':'')+'<div class="gx-bar"><button id="gx-add">'+(adding?'Cancel note':'Add a small piece of evidence')+'</button></div>'+(adding?'<div class="gx-form" role="group" aria-label="New evidence note"><label>Goal<select id="gx-note-goal">'+goals.map((g,i)=>'<option value="'+i+'" '+(i===(focus??0)?'selected':'')+'>'+g.name+'</option>').join('')+'</select></label><label>What do you want to remember?<textarea id="gx-note" maxlength="240" required placeholder="A small moment worth keeping…"></textarea></label><button type="button" id="gx-save">Keep this note</button></div>':'');main.querySelector('#gx-filter').onchange=e=>{focus=e.target.value==='all'?null:+e.target.value;render()};main.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{receipt=+b.dataset.receipt;render();animate(main.querySelector('.gx-receipt'))});main.querySelector('#gx-add').onclick=()=>{adding=!adding;render();if(adding)main.querySelector('#gx-note').focus()};const save=main.querySelector('#gx-save');if(save)save.onclick=e=>{e.preventDefault();const input=main.querySelector('#gx-note'),note=input.value.trim();if(!note){input.setCustomValidity('Write a short note first.');input.reportValidity();input.oninput=()=>input.setCustomValidity('');return;}const g=+main.querySelector('#gx-note-goal').value;evidence.unshift({g,day:17,title:'A moment to keep',art:'A small\nstep forward',note});adding=false;focus=g;render();announce('Note saved in this demo. It does not mark a session complete.');animate(main.querySelector('.gx-evidence'));};}
function render(){({folio,weave,map,studio})[mode]();main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const rect=b.getBoundingClientRect();focus=+b.dataset.open;receipt=null;render();if(mode==='folio')animate(main.querySelector('.gx-page'),rect);else if(mode!=='map')animate(main);announce(goals[focus].name+' selected');});main.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{focus=null;receipt=null;render();announce('All goals')});main.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>toggle(+b.dataset.log,17));}
root.querySelector('#gx-mode').onchange=e=>{mode=e.target.value;focus=null;receipt=null;adding=false;render();announce('')};render();if(globalThis.Tweak)new Tweak({container:root,onChange:()=>{}}).addToggle(prefs,'motion',{label:'Goal opening motion'});
})();
</script>
