name: Post-Merge Verify

# Run checks on one runner type per job. Default: GitHub-hosted ubuntu-latest.
# Set repository variable CI_RUNNER=self-hosted to use the Mac runner instead.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-merge-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-full:
    name: verify-static-full
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "macOS", "cadence-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run timezone process matrix
        run: pnpm test:tz

  verify-integration-full:
    name: verify-integration-full
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "macOS", "cadence-ci"]') || 'ubuntu-latest' }}
    # This job runs the full E2E suite serially across Chromium, WebKit, and
    # mobile WebKit, with CI retries enabled. Keep enough time for all projects
    # to finish so the run reports test failures instead of being canceled mid-suite.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Docker is running (macOS self-hosted)
        if: runner.os == 'macOS'
        shell: bash
        run: bash .github/scripts/ensure-docker-macos.sh

      - name: Disable Mailpit in CI Supabase config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config_path = Path("supabase/config.toml")
          config = config_path.read_text()
          if "[inbucket]\nenabled = true" in config:
              config = config.replace(
                  "[inbucket]\nenabled = true",
                  "[inbucket]\nenabled = false",
                  1,
              )
          elif "[inbucket]\nenabled = false" not in config:
              raise SystemExit("Could not locate [inbucket] enabled setting in supabase/config.toml")
          config_path.write_text(config)
          PY

      - name: Stop stale Supabase containers
        run: pnpm exec supabase stop --all || true

      - name: Start local Supabase (lean profile)
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE="studio,mailpit,imgproxy,analytics,vector,edge-runtime,postgres-meta,logflare,supavisor"
          MAX_ATTEMPTS=4
          BACKOFFS=(5 15 30)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Starting Supabase (attempt ${attempt}/${MAX_ATTEMPTS})..."
            if pnpm supabase:start -- --exclude "$EXCLUDE"; then
              echo "Supabase started successfully on attempt ${attempt}."
              exit 0
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "Supabase failed to start after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            echo "Supabase start failed; stopping containers before retry..."
            pnpm exec supabase stop --all || true
            sleep "${BACKOFFS[$((attempt - 1))]}"
          done

      - name: Reset and seed local database
        run: pnpm supabase:reset

      - name: Check generated database types
        run: |
          pnpm types:supabase
          git diff --exit-code -- packages/shared/src/supabase/database.types.ts

      - name: Lint and advise local database
        run: |
          pnpm exec supabase db lint --local --schema public,private --level warning --fail-on error
          pnpm exec supabase db advisors --local --type all --level warn --fail-on error

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            --override-name db.url=SUPABASE_DB_URL)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}"
            echo "SUPABASE_DB_URL=${SUPABASE_DB_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
          } >> "${GITHUB_ENV}"

      - name: Run automated SQL tests
        run: pnpm test:sql

      - name: Run two-session concurrency harness
        run: pnpm test:concurrency

      - name: Build production application
        run: |
          set -euo pipefail
          # Google Fonts sometimes returns extensionless URLs whose `&` splits
          # Turbopack's font query. The bad CSS is cached, so clear it and retry
          # once. https://github.com/vercel/next.js/issues/99114
          log="$(mktemp)"
          if pnpm build 2>&1 | tee "$log"; then
            exit 0
          fi
          if ! grep -q "next/font/google queries have exactly one entry" "$log"; then
            exit 1
          fi
          echo "Google font build hit the Turbopack query bug. Clearing .next and retrying once."
          rm -rf .next
          pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            pnpm exec playwright install chromium webkit
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi

      - name: Run Chromium, WebKit, mobile, and API E2E
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_PORT="$(
          python3 - <<'PY'
          import socket

          for port in range(3100, 3200):
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                  try:
                      sock.bind(("127.0.0.1", port))
                  except OSError:
                      continue
                  print(port)
                  break
          else:
              raise SystemExit(1)
          PY
          )"

          if [[ -z "${PLAYWRIGHT_PORT}" ]]; then
            echo "Unable to reserve a Playwright port in range 3100-3199." >&2
            exit 1
          fi

          export PLAYWRIGHT_PORT
          export NEXT_PUBLIC_APP_URL="http://localhost:${PLAYWRIGHT_PORT}"
          echo "Running Playwright against ${NEXT_PUBLIC_APP_URL}."
          pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  verify-full:
    name: verify-full
    # always() still runs after job failures; !cancelled() skips superseded
    # concurrency cancellations so they are not reported as main being red.
    if: ${{ always() && !cancelled() }}
    needs:
      - verify-static-full
      - verify-integration-full
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "macOS", "cadence-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Assert all full verify jobs passed
        run: |
          pass() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }
          static_result="${{ needs.verify-static-full.result }}"
          integration_result="${{ needs.verify-integration-full.result }}"
          echo "verify-static-full result: $static_result"
          echo "verify-integration-full result: $integration_result"
          if pass "$static_result" && pass "$integration_result"; then
            exit 0
          fi
          exit 1

  report-main-status:
    name: report-main-status
    if: ${{ always() && !cancelled() }}
    needs:
      - verify-full
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "macOS", "cadence-ci"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Publish post-merge CI alert status
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify-full.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const result = process.env.VERIFY_RESULT;
            const runUrl = process.env.RUN_URL;
            const sha = process.env.SHA;
            const shortSha = sha.slice(0, 7);
            const title = "Post-merge verify failing on main";

            // Cancelled/skipped aggregators are concurrency supersedes, not
            // a red main. Only success/failure should open or close the alert.
            if (result === "cancelled" || result === "skipped") {
              core.info(`Skipping post-merge alert for aggregator result: ${result}`);
              return;
            }

            let existingIssue;
            try {
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`
              });
              existingIssue = search.data.items.find((item) => item.title === title);
            } catch (error) {
              core.warning(`Unable to search for existing CI alert issue: ${error.message}`);
              return;
            }

            if (result === "failure") {
              const failureBody = [
                "Post-merge full verification failed on `main`.",
                "",
                `- Commit: \`${shortSha}\``,
                `- Run: ${runUrl}`,
                `- Time (UTC): ${new Date().toISOString()}`
              ].join("\n");

              try {
                if (existingIssue) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: existingIssue.number,
                    body: failureBody
                  });
                } else {
                  await github.rest.issues.create({
                    owner,
                    repo,
                    title,
                    body: `${failureBody}\n\nThis issue stays open until post-merge verify recovers.`
                  });
                }
              } catch (error) {
                core.warning(`Unable to publish failure alert: ${error.message}`);
              }
              return;
            }

            if (result === "success" && existingIssue) {
              const recoveryBody = [
                "Post-merge full verification recovered.",
                "",
                `- Commit: \`${shortSha}\``,
                `- Run: ${runUrl}`,
                `- Time (UTC): ${new Date().toISOString()}`
              ].join("\n");

              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  body: recoveryBody
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  state: "closed"
                });
              } catch (error) {
                core.warning(`Unable to close recovery alert issue: ${error.message}`);
              }
            }
